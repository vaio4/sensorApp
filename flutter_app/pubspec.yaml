name: sensor_data_dashboard
description: Android 8.0+ live sensor telemetry dashboard, daily step tracker, SQLite session recorder, and CSV exporter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  sensors_plus: ^6.1.0
  pedometer: ^4.0.2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  battery_plus: ^6.0.3
  light: ^3.0.1
  proximity_sensor: ^1.3.0
  camera: ^0.11.0+2
  fl_chart: ^0.69.0
  csv: ^6.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  path: ^1.9.0
  share_plus: ^10.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
